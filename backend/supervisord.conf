[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0

[program:redis]
command=redis-server
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:5167 --timeout 120
directory=/app
autostart=true
autorestart=true
priority=20
environment=CELERY_BROKER_URL="redis://localhost:6379/0",CELERY_RESULT_BACKEND="redis://localhost:6379/0",REDIS_URL="redis://localhost:6379/0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
command=celery -A celery_app:celery_app worker -l INFO -Q celery --concurrency=2
directory=/app
autostart=true
autorestart=true
priority=30
environment=CELERY_BROKER_URL="redis://localhost:6379/0",CELERY_RESULT_BACKEND="redis://localhost:6379/0",REDIS_URL="redis://localhost:6379/0",AUDIO_CELERY_ENABLED="true"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
