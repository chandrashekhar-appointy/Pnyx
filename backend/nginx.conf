worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Honor the original protocol from upstream proxies (nginx -> backend)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Generous timeouts for streaming endpoints
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Allow large file uploads (meeting recordings can be > 100MB)
    client_max_body_size 500M;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Standard HTTP API proxy
        location /api/ {
            proxy_pass http://meeting-copilot-backend:5167/;
        }

        # WebSocket endpoints (e.g. /ws/streaming-audio, /ws/bot-meeting/*).
        # Required so the connection is upgraded to a long-lived ws session.
        location /ws/ {
            proxy_pass http://meeting-copilot-backend:5167;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            # Streaming sessions can run for the entire meeting
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # Locally-served audio recordings (signed-URL endpoint on the backend).
        # Only used when STORAGE_TYPE=local; harmless on GCP deployments.
        location /audio/ {
            proxy_pass http://meeting-copilot-backend:5167;
            proxy_buffering off;
        }

        # Health check endpoints — public on purpose, useful for load balancers.
        location = /health {
            proxy_pass http://meeting-copilot-backend:5167/health;
        }
        location = /health/deep {
            proxy_pass http://meeting-copilot-backend:5167/health/deep;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
