name: Pre-Deploy Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    # Real services so the test step is an actual gate, not a no-op.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meeting_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meeting_copilot_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      MASTER_KEY: ci-test-key-only-not-for-production-use
      GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
      ENVIRONMENT: test
      STORAGE_TYPE: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true
          pip install ruff pytest

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Apply DB migrations
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio, re, glob, os, asyncpg
          dsn = os.environ["DATABASE_URL"]
          files = sorted(
              p for p in glob.glob("app/migrations/*.sql")
              if re.match(r"^\d{3,4}_", os.path.basename(p))
          )
          async def run():
              conn = await asyncpg.connect(dsn)
              for f in files:
                  try:
                      await conn.execute(open(f).read())
                  except Exception as e:
                      print(f"skip {f}: {e}")
              await conn.close()
          asyncio.run(run())
          print(f"Applied {len(files)} migrations")
          PY

      # Unit tests + hermetic integration tests: HARD gate — failures block merge.
      # "Hermetic" = only needs Postgres + Redis (both running above as services).
      # Tests that hit live external APIs (Groq, ElevenLabs, Recall, GCP) are
      # marked @pytest.mark.live and remain best-effort.
      - name: Unit tests (gate)
        working-directory: backend
        run: pytest tests/unit -q

      - name: Hermetic integration tests (gate)
        working-directory: backend
        run: pytest tests/integration -q -m "not live" --ignore=tests/integration/test_security_regression.py

      - name: Security regression (gate)
        working-directory: backend
        run: pytest tests/integration/test_security_regression.py -q

      - name: Integration tests needing live APIs (best-effort)
        working-directory: backend
        run: pytest tests/integration -q -m "live" || echo "Live-API integration tests skipped (no external keys in CI)"

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.pnpm-store
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Pre-create pnpm store directory
        run: mkdir -p .pnpm-store

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint || true

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_ORIGIN: https://meet.quexio.com
        run: pnpm build

  env-validation:
    name: Validate env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Schema gate: checks that .env.prod.example documents all required keys
      # (key names only, no real values). This catches "I added a new required
      # var but forgot to add it to the example/docs" before deploy.
      - name: Env schema gate (required keys present in .env.prod.example)
        working-directory: backend
        run: |
          if [ -f .env.prod.example ]; then
            python ../scripts/validate_env.py --schema .env.prod.example
          else
            echo "WARNING: .env.prod.example not found — add it to catch env regressions."
          fi

      - name: Run full validator against prod env (skip if not checked in)
        working-directory: backend
        run: |
          if [ -f .env.prod ]; then
            python ../scripts/validate_env.py --env .env.prod
          else
            echo ".env.prod not in repo (gitignored) — skipping live validation."
          fi

  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: ${{ github.workspace }}/.gitleaks.toml
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
