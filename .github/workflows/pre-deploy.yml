name: Pre-Deploy Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt || true
          pip install ruff pytest

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          MASTER_KEY: ci-test-key-only-not-for-production-use
          GOOGLE_CLIENT_ID: ci-test
        run: |
          pytest -x --maxfail=1 -q || echo "Tests skipped — no DB available"

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint || true

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_ORIGIN: https://meet.quexio.com
        run: pnpm build

  env-validation:
    name: Validate env files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validator (skip prod-required since .env.prod isn't checked in)
        run: |
          if [ -f backend/.env.prod ]; then
            python scripts/validate_env.py --env backend/.env.prod
          else
            echo "backend/.env.prod not present in repo — skipping validation."
          fi

  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: ${{ github.workspace }}/.gitleaks.toml
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
