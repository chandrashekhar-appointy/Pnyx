name: Synthetic Production Monitoring

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  synthetic-checks:
    name: Prod Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run synthetic monitoring
        working-directory: frontend
        env:
          SYNTHETIC_BASE_URL: ${{ secrets.PROD_URL || 'https://pnyx-dev-206432.bifrost.saastack.site' }}
          SYNTHETIC_BACKEND_URL: ${{ secrets.PROD_BACKEND_URL || 'https://pnyx-dev-206432.bifrost.saastack.site' }}
          E2E_REPORT_DIR: ../test-reports/synthetic
        run: |
          npx playwright test \
            --config playwright.synthetic.config.ts \
            --reporter=json,list

      - name: Upload results on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-failure-${{ github.run_number }}
          path: test-reports/synthetic/
          retention-days: 7

      # Optional: Send alert on failure (uncomment if you have Slack webhook)
