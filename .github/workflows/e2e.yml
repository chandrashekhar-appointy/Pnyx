name: E2E Test Suite

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ── 1. Backend: lint + unit + integration tests ─────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meeting_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Run backend tests (unit + integration)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/meeting_copilot_test
          MASTER_KEY: ci-test-key-only-not-for-production-use
          GOOGLE_CLIENT_ID: ci-test-google-client-id
          ALLOWED_DOMAINS: ""
          ADMIN_EMAILS: admin@example.com
          RATELIMIT_DEFAULT: "10000/minute"
          STORAGE_TYPE: local
          ENVIRONMENT: test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
        run: |
          mkdir -p ../test-reports/backend
          python -m pytest tests/ \
            -m "not llm_eval and not load" \
            --json-report --json-report-file=../test-reports/backend/results.json \
            --junitxml=../test-reports/backend/junit.xml \
            -v --tb=short \
            || true

      - name: Upload backend test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-reports/backend/
          retention-days: 14

  # ── 2. Frontend: lint + build + E2E ─────────────────────────────────────
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: [backend-tests]
    env:
      NPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.pnpm-store

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meeting_copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Pre-create pnpm store directory
        run: mkdir -p .pnpm-store

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:5167
        run: pnpm build

      - name: Start backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/meeting_copilot_test
          MASTER_KEY: ci-test-key-only-not-for-production-use
          GOOGLE_CLIENT_ID: ci-test
          ENVIRONMENT: test
          STORAGE_TYPE: local
          RATELIMIT_DEFAULT: "10000/minute"
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 5167 &
          sleep 5

      - name: Run Playwright E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3118
          E2E_NO_WEBSERVER: ""
          E2E_REPORT_DIR: ../test-reports/playwright
          NEXTAUTH_SECRET: test-secret-do-not-use-in-prod
          NEXTAUTH_URL: http://localhost:3118
          NEXT_PUBLIC_BACKEND_URL: http://localhost:5167
        run: npx playwright test --project=chromium --reporter=json,html

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            test-reports/playwright/
            frontend/test-results/
          retention-days: 14

  # ── 3. Generate combined report ─────────────────────────────────────────
  report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-e2e]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: test-reports/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate Markdown report
        run: python scripts/generate_test_report.py

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-md
          path: test-reports/TEST_REPORT.md
          retention-days: 30

      - name: Post report summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🧪 Test Report" >> $GITHUB_STEP_SUMMARY
          cat test-reports/TEST_REPORT.md >> $GITHUB_STEP_SUMMARY
